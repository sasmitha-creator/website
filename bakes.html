<!DOCTYPE html>
<html>
<head>
    <title>SAS Bakes</title>

    <style>
        body {
            background-color: blue;
            padding: 20px;
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #banner {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        #banner img {
            width: 100%;
            max-width: 900px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        #Menus {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        #ev {
            background-color: pink;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
        }

        button {
            background-color: pink;
            color: black;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="banner">
        <h1>SAS BAKES</h1>

        <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1200&q=80"
             alt="Freshly baked bread and bakery items">

        <p>Welcome to SAS Bakes</p>
    </div>

    <div id="Menus">
        <h1>Menus</h1>

        <div id="ev">
            <h2>Tea</h2>
            <h2>Coffee</h2>
            <h2>Puffs</h2>
            <h2>Cookies</h2>
        </div>

        <h1>Cakes Order</h1>

        <button>Place Orders</button>
    </div>

</body>
</html>
